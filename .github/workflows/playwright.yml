name: Playwright Tests
on:
    # want to keep this as manual activation
    # push:
    #     branches: [dev]
    # pull_request:
    #     branches: [dev]
    workflow_dispatch:
        inputs:
            update_snapshots:
                description: Capture per-OS pixel baselines with --update-snapshots=all and upload them for commit
                required: false
                type: boolean
                default: false

jobs:
    test:
        # keep timeout low in case it hangs. Should run in well under a minute.
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install libraries
              run: sudo apt-get install libfontconfig1-dev
            - name: Install dependencies
              run: npm install
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Build
              run: npm run build
            - name: Run Playwright tests
              run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" -- npm run test:playwright -- ${{ inputs.update_snapshots && '--update-snapshots=all' || '' }}
            #   if: matrix.os == 'ubuntu-latest'
            # - run: npm run test
            #   if: matrix.os != 'ubuntu-latest'
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-output
                  path: test-output/
                  retention-days: 30
            - uses: actions/upload-artifact@v4
              if: ${{ inputs.update_snapshots }}
              with:
                  name: pixel-baselines
                  path: |
                      config/testing/output-render.test.ts-snapshots/
                      config/testing/smoke.test.ts-snapshots/
